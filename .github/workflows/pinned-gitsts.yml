name: pinned-gists
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  github-status-box:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install github-stats-box
        run: npm install github-stats-box
      - name: Patch github-stats-box to handle null nodes in repositories
        run: node -e "const fs = require('fs'); const file = 'node_modules/github-stats-box/index.js'; let content = fs.readFileSync(file, 'utf8'); content = content.replace('curr.stargazers.totalCount', '(curr && curr.stargazers ? curr.stargazers.totalCount : 0)'); fs.writeFileSync(file, content);"
      - name: Run github-stats-box
        run: npx github-stats-box
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Do not edit, defined in secrets
          GIST_ID: f23f21fbb26f805b1c9e75497fa8434a
          ALL_COMMITS: true # If `true` it will count all commits, if `false` it will count your last year commits
          K_FORMAT: false # If `true`, large numbers will be formatted with a "k", for example "1.5k"
