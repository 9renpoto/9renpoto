name: wakatime

on:
  schedule:
    - cron: "0 0-12/4 * * *"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Update README with development stats
        uses: anmol098/waka-readme-stats@c6070c1
        with:
          GH_TOKEN: ${{ github.token }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
